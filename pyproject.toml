[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autom2m"
version = "0.4.0"
description = "AutoM2M: checking LLM-assembled agent teams with model transformations (runtime: AgentHOT, Agent Hand-Off Transformations)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyecore>=0.15",
    "lark>=1.3",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
serve = ["mcp>=1.2", "fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6", "mcp>=1.2", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "build>=1.2", "twine>=5.0"]
eval = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "datasets>=2.19",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
]

[project.scripts]
agenthot = "agenthot.cli:main"
autom2m = "autom2m.cli:main"
autom2m-mcp = "autom2m.mcp_server:main"
autom2m-serve = "autom2m.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenthot = ["rules/*.lark", "templates/**/*.yaml", "templates/**/*.agenthot", "templates/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# Supply-chain cooldown: don't resolve package versions published in the last week.
exclude-newer = "7 days"
# Rebuild when engine sources change, not only pyproject.toml, so a plugin
# pointed at a local checkout (AUTOM2M_ENGINE=/path/to/repo) picks up edits.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.lark" },
    { file = "src/agenthot/templates/**/*" },
]
