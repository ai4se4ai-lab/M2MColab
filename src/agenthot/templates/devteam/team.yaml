# DevTeam -- the running example of the agentm2m paper (Sec. II-B).
# Analyst -> Architect -> Developer, plus a direct Analyst -> Tester hand-off.
# Each view is owned by exactly one agent (write rights omega); hand-offs are
# the rule modules under rules/. Edit freely: `/agentm2m:status` re-validates.
name: devteam

views:
  Req:
    owner: Analyst
    classes:
      Epic:      {attributes: [name]}
      Criterion: {attributes: [id, text]}
      UserStory:
        attributes: [id, title, status]          # status: draft | accepted
        references:
          epic: Epic
          criteria: {type: Criterion, many: true, containment: true}
    root: {class: ReqModel, slots: {epics: Epic, stories: UserStory}}
    seed:
      epics:
        - {name: E1}
      stories:
        - id: S1
          title: create a task
          status: accepted
          epic: "Epic#E1"
          criteria:
            - {id: S1.1, text: a title is required}
        - id: S2
          title: mark a task done
          status: accepted
          epic: "Epic#E1"
          criteria:
            - {id: S2.1, text: completing a done task is rejected}
        - id: S3
          title: export tasks as CSV
          status: draft
          epic: "Epic#E1"
          criteria:
            - {id: S3.1, text: the file has a header row}

  Arch:
    owner: Architect
    classes:
      Component: {attributes: [name]}
      Operation:
        attributes: [name, signature, criteria]   # criteria: copied structurally by T1, read by T2
        references: {component: Component}
    root: {class: ArchModel, slots: {components: Component, operations: Operation}}

  Code:
    owner: Developer
    classes:
      CodeEdit:
        attributes: [name, body]
        references: {operation: Arch.Operation}
    root: {class: CodeModel, slots: {edits: CodeEdit}}

  Test:
    owner: Tester
    classes:
      TestCase:
        attributes: [name, oracle]
        references: {criterion: Req.Criterion}
    root: {class: TestModel, slots: {cases: TestCase}}

handoffs:
  - {name: Req2Arch,  rule: rules/Req2Arch.agentm2m}    # T1
  - {name: Arch2Code, rule: rules/Arch2Code.agentm2m}   # T2
  - {name: Req2Test,  rule: rules/Req2Test.agentm2m}    # T4
